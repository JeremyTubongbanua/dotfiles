onboarding = false # no longer shows onboarding (cause we used it before)

[keys]
# when you do `Ctrl+b+w` you can navigate using `k` and `j`
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]

[ui]
# when you create a new workspace (via `Ctrl+b+N`) will prompt the workspace name
prompt_new_workspace_name = true
# shows the detected/reported agent name (e.g. `claude`) in a split pane's
# border, unless that pane has a manual label set via `herdr pane rename`
show_agent_labels_on_pane_borders = true


[theme]
name = "catppuccin"
light_name="catppuccin-latte"
dark_name="catppuccin-macchiato"
auto_switch = true

# `Ctrl+b` then `Shift+m`: prompt for a directory + name, then build a 3-tab
[[keys.command]]
key = "prefix+shift+m"
type = "popup"
command = "/Users/jeremytubongbanua/.config/herdr/new-workspace.zsh"
width = "70%"
height = "40%"
